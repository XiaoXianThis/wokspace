name: pages

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/wok/go.mod
          cache-dependency-path: apps/wok/go.mod

      - name: Build the site with wok
        run: |
          (cd apps/wok && go build -o ../../build/wok/ .)
          build/wok/wok test site
          build/wok/wok build site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v4
